[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-multipoint-threshold"
version = "0.1.0"
description = "Multi-point thresholding utilities for reconstruction-based anomaly detection."
readme = "README.MD"
requires-python = ">=3.9,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Muhammad Rashid" },
  { name = "Hakim Ziani" }
]
keywords = [
  "anomaly-detection",
  "thresholding",
  "vae-gan",
  "pytorch",
  "robotics"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "torch",
  "torchvision",
  "pandas",
  "matplotlib",
  "seaborn",
  "opencv-python",
  "tqdm",
  "scipy",
  "scikit-learn",
  "scikit-image",
  "PyYAML",
  "Pillow",
  "numpy"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff"
]
notebooks = [
  "jupyter",
  "ipykernel"
]

[project.urls]
Homepage = "https://github.com/rashidrao-pk/AD_MultiPointThreshold"
Repository = "https://github.com/rashidrao-pk/AD_MultiPointThreshold"
Issues = "https://github.com/rashidrao-pk/AD_MultiPointThreshold/issues"

[project.scripts]
ad-model-loader = "utils.scripts.model_loader:main"
ad-train = "utils.scripts.train:main"
ad-run-vaegan = "experiments.run_vaegan:cli"
ad-calibrate-threshold = "utils.scripts.calibrate_threshold:main"
ad-live-inference = "utils.scripts.inference:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
  "data*",
  "experiments*",
  "models*",
  "modules*",
  "utils*"
]
namespaces = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
