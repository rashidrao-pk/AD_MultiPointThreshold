# Example ablation config. The scripts use command-line args for simplicity,
# but this file documents the recommended experiment design.
experiment_name: ablation_v1
device: auto              # auto | cuda | mps | cpu
image_size: 128
batch_size: 16
latent_dims: 64
epochs: 30
models:
  - ae
  - vae
  - vaegan
  - deep_svdd
score_methods:
  - l1_max
  - l1_mean
  - l1_q95
  - l2_max
threshold_methods:
  - q99
  - median_mad
  - max
multi_point:
  quantiles: [0.50, 0.75, 0.90, 0.95, 0.99]
  extra_features: [mean, std, max]
  vote: any
selection_rule:
  primary: mp_f1
  secondary: image_auroc
  tie_breaker: inference_time_ms
