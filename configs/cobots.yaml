device: auto

data:
  name: Cobots_Synthetic
  dataset_root: "${COBOTS_DATASET_ROOT:-${DATA_ROOT:-data}/Cobots_Synthetic}"

  category: PLeft
  img_size: 128
  batch_size: 16
  num_workers: 0
  pin_memory: false
  augmentation: light


model:
  name: vaegan
  checkpoint_root: "${VAEGAN_ROOT:-models/vaegan}"
  latent_dim: 64
  pretrained: true

training:
  epochs: 20
  learning_rate_enc_dec: 0.001
  learning_rate_dis: 0.0001
  beta_kl: 0.0001
  beta_gan: 0.0001
  save_every: 1

scoring:
  method: reconstruction_l1
  quantiles: [0.5, 0.75, 0.9, 0.95, 0.99]



threshold:
  method: single_point
  percentile: 95 # 
  decision_rule: any 

output:
  dir: results/exp

experiment:
  models:
    - advis_vaegan
    - simple_vaegan
  scoring_setups:
    - name: l1_mean
      method: reconstruction_l1
    - name: l2_sum
      method: reconstruction_l2
    - name: quantiles
      method: reconstruction_quantiles
      quantiles: [0.5, 0.75, 0.9, 0.95, 0.99]
  threshold_setups:
    - name: single_p95
      method: single_point
      percentile: 95
      decision_rule: any
    - name: single_p99
      method: single_point
      percentile: 99
      decision_rule: any
    - name: multipoint_p95_any
      method: multi_point
      percentile: 95
      decision_rule: any



# decision rules for multi-point thresholding:
# - any: if any of the scores exceed the threshold, classify as anomaly
# - all: if all scores exceed the threshold, classify as anomaly
# - majority: if more than half of the scores exceed the threshold, classify as anomaly
