<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inference Plot Viewer</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17202a;
        --muted: #65707c;
        --line: #d7dde4;
        --panel: #ffffff;
        --soft: #f4f7fa;
        --accent: #1167b1;
        --accent-soft: #e8f2fb;
        --danger: #a43131;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--soft);
      }

      header,
      main {
        width: min(1320px, calc(100% - 28px));
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 22px 0 14px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 3vw, 2.4rem);
        letter-spacing: 0;
      }

      a {
        color: var(--accent);
        font-weight: 650;
        text-decoration: none;
      }

      main {
        display: grid;
        gap: 14px;
        padding-bottom: 28px;
      }

      .toolbar,
      .viewer {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 14px 34px rgba(16, 32, 48, 0.07);
      }

      .toolbar {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      .fields {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) minmax(260px, 1fr) auto;
        gap: 12px;
        align-items: end;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 650;
      }

      input,
      select {
        width: 100%;
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 10px;
        color: var(--ink);
        background: #fff;
        font: inherit;
      }

      button {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 13px;
        color: var(--ink);
        background: #fff;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button[aria-selected="true"] {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-soft);
      }

      .status {
        color: var(--muted);
        font-size: 0.86rem;
        text-align: right;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(5, minmax(120px, 1fr));
        gap: 10px;
      }

      .metric {
        display: grid;
        gap: 3px;
        min-height: 58px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #f8fafc;
      }

      .metric span {
        color: var(--muted);
        font-size: 0.74rem;
        font-weight: 750;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 12px 0;
      }

      .stage {
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .path {
        overflow-wrap: anywhere;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.82rem;
      }

      .image-frame {
        display: grid;
        place-items: center;
        min-height: 66vh;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        overflow: auto;
      }

      img {
        display: block;
        max-width: 100%;
        max-height: 78vh;
        object-fit: contain;
      }

      .missing {
        display: none;
        max-width: 560px;
        padding: 18px;
        color: var(--danger);
        text-align: center;
        line-height: 1.45;
      }

      details {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #f8fafc;
      }

      summary {
        cursor: pointer;
        padding: 11px 12px;
        color: var(--ink);
        font-weight: 750;
      }

      .notes {
        display: grid;
        gap: 10px;
        padding: 0 12px 12px;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.5;
      }

      .notes p {
        margin: 0;
      }

      @media (max-width: 820px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .fields,
        .metrics {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Inference Plot Viewer</h1>
      <nav>
        <a href="/training">Training</a>
        <span> · </span>
        <a href="/app/home.html">Home</a>
      </nav>
    </header>

    <main>
      <section class="toolbar" aria-label="Inference controls">
        <div class="fields">
          <label>
            Experiments
            <select id="experimentSelect">
              <option value="">Loading experiments...</option>
            </select>
          </label>
          <label>
            Experiment folder
            <input id="runPath" type="text" value="results/experiments/E00008" />
          </label>
          <button id="refreshButton" type="button">Refresh</button>
        </div>
        <div class="status" id="statusText">Waiting for experiment plots...</div>
        <div class="metrics" id="metricsGrid"></div>
      </section>

      <section class="viewer">
        <nav class="tabs" aria-label="Inference plot tabs">
          <button type="button" data-tab="scores" aria-selected="true">Score Distribution</button>
          <button type="button" data-tab="latent" aria-selected="false">Latent Space</button>
          <button type="button" data-tab="samples" aria-selected="false">Validation Samples</button>
          <button type="button" data-tab="confusion" aria-selected="false">Confusion Matrix</button>
          <button type="button" data-tab="roc" aria-selected="false">ROC</button>
          <button type="button" data-tab="pr" aria-selected="false">Precision-Recall</button>
          <button type="button" data-tab="outcomes" aria-selected="false">Outcomes</button>
          <button type="button" data-tab="classes" aria-selected="false">Classes</button>
          <button type="button" data-tab="tp" aria-selected="false">TP</button>
          <button type="button" data-tab="tn" aria-selected="false">TN</button>
          <button type="button" data-tab="fp" aria-selected="false">FP</button>
          <button type="button" data-tab="fn" aria-selected="false">FN</button>
        </nav>

        <div class="stage">
          <div class="meta">
            <strong id="tabTitle">Score Distribution</strong>
            <span class="path" id="imagePath"></span>
          </div>
          <div class="image-frame">
            <img id="plotImage" alt="Inference plot" />
            <div id="missingMessage" class="missing"></div>
          </div>
          <details>
            <summary id="notesTitle">About this plot</summary>
            <div class="notes" id="notesBody"></div>
          </details>
        </div>
      </section>
    </main>

    <script>
      const tabs = {
        scores: {
          title: "Score Distribution",
          notes: [
            "Shows normal and anomalous inference score distributions with histogram and KDE views.",
            "A useful model should place anomalous samples at higher scores than normal samples, with minimal overlap around the threshold.",
          ],
        },
        latent: {
          title: "Latent Space",
          notes: [
            "Shows encoder latent vectors for test samples projected to two dimensions.",
            "This plot is generated from the saved experiment config and model checkpoint when available.",
          ],
        },
        samples: {
          title: "Validation Samples",
          notes: [
            "Shows representative normal and anomalous samples with reconstruction and anomaly map.",
            "Use this to inspect whether high scores come from meaningful defects or unwanted background/artifact reconstruction errors.",
          ],
        },
        confusion: { title: "Confusion Matrix", notes: ["Shows TN, FP, FN, and TP counts after thresholding."] },
        roc: { title: "ROC Curve", notes: ["Shows ranking quality across all possible thresholds."] },
        pr: { title: "Precision-Recall", notes: ["Useful when anomalies are rare or class balance is uneven."] },
        outcomes: { title: "Outcome Counts", notes: ["Counts prediction outcomes after thresholding."] },
        classes: { title: "Mean Score by Class", notes: ["Shows which defect classes receive higher or lower anomaly scores."] },
        tp: { title: "Top True Positives", notes: ["Highest-scoring correctly detected anomalies."] },
        tn: { title: "Top True Negatives", notes: ["Lowest-scoring correctly accepted normal samples."] },
        fp: { title: "Top False Positives", notes: ["Normal samples incorrectly marked anomalous."] },
        fn: { title: "Top False Negatives", notes: ["Anomalies missed by the selected threshold."] },
      };

      const state = { tab: "scores", payload: null };
      const experimentSelect = document.getElementById("experimentSelect");
      const runPath = document.getElementById("runPath");
      const refreshButton = document.getElementById("refreshButton");
      const statusText = document.getElementById("statusText");
      const metricsGrid = document.getElementById("metricsGrid");
      const tabTitle = document.getElementById("tabTitle");
      const imagePath = document.getElementById("imagePath");
      const plotImage = document.getElementById("plotImage");
      const missingMessage = document.getElementById("missingMessage");
      const notesTitle = document.getElementById("notesTitle");
      const notesBody = document.getElementById("notesBody");
      const tabButtons = Array.from(document.querySelectorAll("[data-tab]"));

      function normalizeRunPath(value) {
        return value.trim().replace(/\/+$/, "");
      }

      function numberText(value) {
        if (value === undefined || value === null || value === "") {
          return "-";
        }
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed.toFixed(4) : String(value);
      }

      function renderMetrics(metrics) {
        const preferred = [
          ["auroc", "AUROC"],
          ["auprc", "AUPRC"],
          ["accuracy", "Accuracy"],
          ["f1", "F1"],
          ["precision", "Precision"],
          ["recall", "Recall"],
        ];
        metricsGrid.innerHTML = "";
        preferred
          .filter(([key]) => Object.prototype.hasOwnProperty.call(metrics || {}, key))
          .forEach(([key, label]) => {
            const item = document.createElement("div");
            item.className = "metric";
            const title = document.createElement("span");
            title.textContent = label;
            const value = document.createElement("strong");
            value.textContent = numberText(metrics[key]);
            item.appendChild(title);
            item.appendChild(value);
            metricsGrid.appendChild(item);
          });
      }

      function currentImagePath() {
        const plot = state.payload?.plots?.[state.tab];
        return plot?.path ? `../${plot.path}` : "";
      }

      function updateView() {
        const tab = tabs[state.tab];
        const src = currentImagePath();
        tabTitle.textContent = tab.title;
        imagePath.textContent = src || "Missing plot";
        missingMessage.style.display = "none";
        plotImage.style.display = "block";
        if (src) {
          plotImage.src = `${src}?t=${Date.now()}`;
          plotImage.alt = tab.title;
        } else {
          plotImage.removeAttribute("src");
          plotImage.style.display = "none";
          missingMessage.style.display = "block";
          missingMessage.textContent = `No ${tab.title} plot found. Run python -m modules.plotting.plot_experiment_results --run_dir ${normalizeRunPath(runPath.value)}`;
        }
        notesTitle.textContent = `About ${tab.title}`;
        notesBody.innerHTML = "";
        tab.notes.forEach((text) => {
          const paragraph = document.createElement("p");
          paragraph.textContent = text;
          notesBody.appendChild(paragraph);
        });
      }

      async function loadExperiments() {
        const response = await fetch("/api/experiments", { cache: "no-store" });
        const payload = await response.json();
        const experiments = payload.experiments || [];
        experimentSelect.innerHTML = "";
        if (!experiments.length) {
          experimentSelect.innerHTML = '<option value="">No experiments found</option>';
          return;
        }
        experiments.forEach((experiment) => {
          const option = document.createElement("option");
          option.value = experiment.path;
          option.textContent = `${experiment.name} | ${new Date(experiment.mtime * 1000).toLocaleString()}`;
          experimentSelect.appendChild(option);
        });
        const current = normalizeRunPath(runPath.value).replace(/^(\.\.\/)+/, "");
        const hasCurrent = experiments.some((experiment) => experiment.path === current);
        experimentSelect.value = hasCurrent ? current : experiments[0].path;
        if (!hasCurrent) {
          runPath.value = experiments[0].path;
        }
      }

      async function refreshStatus() {
        try {
          const run = normalizeRunPath(runPath.value).replace(/^(\.\.\/)+/, "");
          const response = await fetch(`/api/inference_status?run=${encodeURIComponent(run)}`, { cache: "no-store" });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.error || "Could not read inference status.");
          }
          state.payload = payload;
          renderMetrics(payload.metrics || {});
          const seconds = payload.seconds_since_update;
          statusText.textContent = seconds === null || seconds === undefined
            ? "No generated inference plots found yet."
            : `Last plot update ${Math.round(seconds)}s ago.`;
          updateView();
        } catch (error) {
          statusText.textContent = error.message;
        }
      }

      plotImage.addEventListener("error", () => {
        plotImage.style.display = "none";
        missingMessage.style.display = "block";
        missingMessage.textContent = `Could not load ${tabs[state.tab].title}. Regenerate plots for this experiment.`;
      });

      tabButtons.forEach((button) => {
        button.addEventListener("click", () => {
          state.tab = button.dataset.tab;
          tabButtons.forEach((item) => item.setAttribute("aria-selected", String(item === button)));
          updateView();
        });
      });

      refreshButton.addEventListener("click", refreshStatus);
      experimentSelect.addEventListener("change", () => {
        runPath.value = experimentSelect.value;
        refreshStatus();
      });
      runPath.addEventListener("change", refreshStatus);

      loadExperiments().then(refreshStatus);
    </script>
  </body>
</html>
