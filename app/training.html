<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Training Plot Viewer</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        --ink: #17202a;
        --muted: #65707c;
        --line: #d7dde4;
        --panel: #ffffff;
        --soft: #f4f7fa;
        --accent: #1167b1;
        --accent-soft: #e8f2fb;
        --danger: #a43131;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--soft);
      }

      header,
      main {
        width: min(1320px, calc(100% - 28px));
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 22px 0 14px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 3vw, 2.4rem);
        letter-spacing: 0;
      }

      a {
        color: var(--accent);
        font-weight: 650;
        text-decoration: none;
      }

      main {
        display: grid;
        gap: 14px;
        padding-bottom: 28px;
      }

      .toolbar,
      .viewer {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 14px 34px rgba(16, 32, 48, 0.07);
      }

      .toolbar {
        display: grid;
        gap: 14px;
        padding: 14px;
      }

      .fields {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) 120px 120px;
        gap: 12px;
        align-items: end;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 650;
      }

      input[type="text"],
      input[type="number"] {
        width: 100%;
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 10px;
        color: var(--ink);
        background: #fff;
        font: inherit;
      }

      .slider-row {
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        gap: 12px;
        align-items: center;
      }

      .epoch-badge {
        min-width: 120px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #f8fafc;
        text-align: center;
        font-weight: 750;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 12px 0;
      }

      button {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 13px;
        color: var(--ink);
        background: #fff;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button[aria-selected="true"] {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-soft);
      }

      .stage {
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .image-frame {
        display: grid;
        place-items: center;
        min-height: 66vh;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        overflow: auto;
      }

      img {
        display: block;
        max-width: 100%;
        max-height: 78vh;
        object-fit: contain;
      }

      .missing {
        display: none;
        max-width: 560px;
        padding: 18px;
        color: var(--danger);
        text-align: center;
        line-height: 1.45;
      }

      .path {
        overflow-wrap: anywhere;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.82rem;
      }

      .status {
        color: var(--muted);
        font-size: 0.86rem;
        text-align: right;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(5, minmax(120px, 1fr));
        gap: 10px;
      }

      .metric {
        display: grid;
        gap: 3px;
        min-height: 64px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #f8fafc;
      }

      .metric span {
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 700;
      }

      .metric strong {
        font-size: 1.05rem;
      }

      .live-dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 6px;
        border-radius: 999px;
        background: #8a98a8;
      }

      .live-dot.on {
        background: #168a45;
        box-shadow: 0 0 0 4px rgba(22, 138, 69, 0.14);
      }

      .plotly-panel {
        display: none;
        min-height: 360px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
      }

      @media (max-width: 820px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .fields,
        .slider-row {
          grid-template-columns: 1fr;
        }

        .image-frame {
          min-height: 48vh;
        }

        .metrics {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Training Plot Viewer</h1>
      <a href="/app/home.html">Home</a>
    </header>

    <main>
      <section class="toolbar" aria-label="Plot controls">
        <div class="fields">
          <label>
            Saved runs
            <select id="runSelect">
              <option value="">Loading runs...</option>
            </select>
          </label>
          <label>
            Run folder
            <input
              id="runPath"
              type="text"
              value="../results/runs/MVTec_hazelnut_simple_vaegan_2026_06_27_19_05_01"
            />
          </label>
          <label>
            Max epoch
            <input id="maxEpoch" type="number" min="1" value="360" />
          </label>
          <label>
            Plot every
            <input id="plotEvery" type="number" min="1" value="5" />
          </label>
        </div>

        <div class="slider-row">
          <span class="epoch-badge" id="epochLabel">Epoch 0001</span>
          <input id="epochSlider" type="range" min="0" value="0" step="1" />
          <button id="refreshButton" type="button">Refresh</button>
          <button id="liveButton" type="button" aria-pressed="true">
            Live On
          </button>
        </div>
        <div class="status" id="liveStatus">Waiting for plots...</div>
        <div class="metrics" aria-label="Live training metrics">
          <div class="metric">
            <span>STREAM</span>
            <strong id="streamMetric"><i class="live-dot" id="liveDot"></i>Disconnected</strong>
          </div>
          <div class="metric">
            <span>EPOCH</span>
            <strong id="epochMetric">-</strong>
          </div>
          <div class="metric">
            <span>RECON</span>
            <strong id="reconMetric">-</strong>
          </div>
          <div class="metric">
            <span>VAL RECON</span>
            <strong id="valReconMetric">-</strong>
          </div>
          <div class="metric">
            <span>DISC</span>
            <strong id="discMetric">-</strong>
          </div>
        </div>
      </section>

      <section class="viewer">
        <nav class="tabs" aria-label="Training plot tabs">
          <button type="button" data-tab="curves" aria-selected="true">
            Training Curves
          </button>
          <button type="button" data-tab="latent" aria-selected="false">
            Latent Space
          </button>
          <button type="button" data-tab="evolution" aria-selected="false">
            Evolution
          </button>
          <button type="button" data-tab="scores" aria-selected="false">
            Score Distribution
          </button>
        </nav>

        <div class="stage">
          <div class="meta">
            <strong id="tabTitle">Training Curves</strong>
          <span class="path" id="imagePath"></span>
        </div>
        <div id="plotlyPanel" class="plotly-panel"></div>
        <div class="image-frame">
            <img id="plotImage" alt="Training plot" />
            <div id="missingMessage" class="missing"></div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const tabs = {
        curves: {
          title: "Training Curves",
          folder: "plots/training_curves",
          prefix: "training_curves_epoch_",
        },
        latent: {
          title: "Latent Space",
          folder: "plots/latent_space",
          prefix: "latent_space_epoch_",
        },
        evolution: {
          title: "Evolution",
          folder: "plots/training_evolution",
          prefix: "training_evolution_epoch_",
        },
        scores: {
          title: "Score Distribution",
          folder: "plots/score_distribution",
          prefix: "score_distribution_epoch_",
        },
      };

      const state = {
        tab: "curves",
        epochs: [1],
        epochsByTab: {},
        live: true,
        liveTimer: null,
        eventSource: null,
      };

      const runPath = document.getElementById("runPath");
      const runSelect = document.getElementById("runSelect");
      const maxEpoch = document.getElementById("maxEpoch");
      const plotEvery = document.getElementById("plotEvery");
      const epochSlider = document.getElementById("epochSlider");
      const epochLabel = document.getElementById("epochLabel");
      const refreshButton = document.getElementById("refreshButton");
      const liveButton = document.getElementById("liveButton");
      const liveStatus = document.getElementById("liveStatus");
      const liveDot = document.getElementById("liveDot");
      const streamMetric = document.getElementById("streamMetric");
      const epochMetric = document.getElementById("epochMetric");
      const reconMetric = document.getElementById("reconMetric");
      const valReconMetric = document.getElementById("valReconMetric");
      const discMetric = document.getElementById("discMetric");
      const plotlyPanel = document.getElementById("plotlyPanel");
      const tabTitle = document.getElementById("tabTitle");
      const imagePath = document.getElementById("imagePath");
      const plotImage = document.getElementById("plotImage");
      const missingMessage = document.getElementById("missingMessage");
      const tabButtons = Array.from(document.querySelectorAll("[data-tab]"));

      function padEpoch(epoch) {
        return String(epoch).padStart(4, "0");
      }

      function normalizeRunPath(value) {
        return value.trim().replace(/\/+$/, "");
      }

      function syncSelectedRun() {
        const current = normalizeRunPath(runPath.value).replace(/^(\.\.\/)+/, "");
        if (Array.from(runSelect.options).some((option) => option.value === current)) {
          runSelect.value = current;
        }
      }

      function selectRun(runValue, keepLatest = true) {
        if (!runValue) {
          return;
        }
        runPath.value = runValue;
        state.epochsByTab = {};
        if (state.live) {
          setLiveMode(true);
        } else {
          refreshLiveEpochs(keepLatest);
        }
      }

      async function loadRuns() {
        if (window.location.protocol === "file:") {
          runSelect.innerHTML = '<option value="">Serve with app.py for run list</option>';
          runSelect.disabled = true;
          return;
        }

        try {
          const response = await fetch("/api/runs", { cache: "no-store" });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.error || "Could not load runs.");
          }
          const runs = payload.runs || [];
          if (!runs.length) {
            runSelect.innerHTML = '<option value="">No runs found</option>';
            return;
          }

          runSelect.innerHTML = "";
          runs.forEach((run) => {
            const option = document.createElement("option");
            const date = new Date(run.mtime * 1000).toLocaleString();
            option.value = run.path;
            option.textContent = `${run.name} | ${date}`;
            runSelect.appendChild(option);
          });

          const current = normalizeRunPath(runPath.value).replace(/^(\.\.\/)+/, "");
          const hasCurrent = runs.some((run) => run.path === current);
          runSelect.value = hasCurrent ? current : runs[0].path;
          if (!hasCurrent) {
            selectRun(runs[0].path, true);
          }
        } catch (error) {
          runSelect.innerHTML = '<option value="">Could not load runs</option>';
          liveStatus.textContent = error.message;
        }
      }

      function buildEpochs() {
        const maxValue = Math.max(parseInt(maxEpoch.value || "1", 10), 1);
        const stepValue = Math.max(parseInt(plotEvery.value || "1", 10), 1);
        const values = [1];
        for (let epoch = stepValue; epoch <= maxValue; epoch += stepValue) {
          if (!values.includes(epoch)) {
            values.push(epoch);
          }
        }
        if (!values.includes(maxValue)) {
          values.push(maxValue);
        }
        state.epochs = values.sort((a, b) => a - b);
        epochSlider.max = String(state.epochs.length - 1);
        epochSlider.value = String(
          Math.min(
            parseInt(epochSlider.value || "0", 10),
            state.epochs.length - 1,
          ),
        );
      }

      function setEpochs(values, keepLatest = true) {
        const oldEpoch = currentEpoch();
        state.epochs = Array.from(new Set(values)).sort((a, b) => a - b);
        if (state.epochs.length === 0) {
          state.epochs = [1];
        }
        epochSlider.max = String(state.epochs.length - 1);
        if (keepLatest) {
          epochSlider.value = String(state.epochs.length - 1);
        } else {
          const nearest = state.epochs.reduce((best, epoch, index) => {
            return Math.abs(epoch - oldEpoch) <
              Math.abs(state.epochs[best] - oldEpoch)
              ? index
              : best;
          }, 0);
          epochSlider.value = String(nearest);
        }
      }

      function currentEpoch() {
        return state.epochs[parseInt(epochSlider.value || "0", 10)] || 1;
      }

      function currentImagePath() {
        const tab = tabs[state.tab];
        const epoch = padEpoch(currentEpoch());
        return `${normalizeRunPath(runPath.value)}/${tab.folder}/${tab.prefix}${epoch}.png`;
      }

      function currentServerImagePath() {
        const tab = tabs[state.tab];
        const epoch = padEpoch(currentEpoch());
        return `../${normalizeRunPath(runPath.value).replace(/^(\.\.\/)+/, "")}/${tab.folder}/${tab.prefix}${epoch}.png`;
      }

      function updateView() {
        const tab = tabs[state.tab];
        const epoch = currentEpoch();
        const src =
          window.location.protocol === "file:"
            ? currentImagePath()
            : currentServerImagePath();
        tabTitle.textContent = tab.title;
        epochLabel.textContent = `Epoch ${padEpoch(epoch)}`;
        imagePath.textContent = src;
        missingMessage.style.display = "none";
        plotImage.style.display = "block";
        plotImage.src = src;
        plotImage.alt = `${tab.title} at epoch ${epoch}`;
        plotlyPanel.style.display = state.tab === "curves" ? "block" : "none";
      }

      function numberText(value) {
        if (value === undefined || value === null || value === "") {
          return "-";
        }
        const parsed = Number(value);
        if (!Number.isFinite(parsed)) {
          return String(value);
        }
        return parsed.toFixed(6);
      }

      function updateMetricCards(payload) {
        const latest = payload.latest_metrics || {};
        const seconds = payload.seconds_since_update;
        const isLive = Boolean(payload.is_live);
        streamMetric.innerHTML = `<i class="live-dot ${isLive ? "on" : ""}"></i>${isLive ? "Live" : "Idle"}`;
        epochMetric.textContent = latest.epoch || payload.latest?.curves || "-";
        reconMetric.textContent = numberText(latest.recon_loss);
        valReconMetric.textContent = numberText(latest.val_recon_loss);
        discMetric.textContent = numberText(latest.disc_loss);
        if (seconds === null || seconds === undefined) {
          liveStatus.textContent = "No training files found yet.";
        } else {
          liveStatus.textContent = `${isLive ? "Training appears live" : "No recent write"}; last update ${Math.round(seconds)}s ago.`;
        }
      }

      function renderPlotly(history) {
        if (!window.Plotly || !Array.isArray(history) || history.length === 0) {
          return;
        }
        const epochs = history.map((row) => Number(row.epoch));
        const columns = [
          ["recon_loss", "Recon"],
          ["val_recon_loss", "Val recon"],
          ["vae_loss", "VAE"],
          ["disc_loss", "Disc"],
        ];
        const traces = columns
          .filter(([key]) => history.some((row) => row[key] !== undefined && row[key] !== ""))
          .map(([key, label]) => ({
            x: epochs,
            y: history.map((row) => Number(row[key])),
            mode: "lines",
            name: label,
          }));
        Plotly.react(plotlyPanel, traces, {
          margin: { l: 50, r: 150, t: 24, b: 42 },
          xaxis: { title: "Epoch" },
          yaxis: { title: "Loss" },
          showlegend: true,
          legend: {
            title: { text: "Losses" },
            orientation: "v",
            x: 1.02,
            xanchor: "left",
            y: 1,
            yanchor: "top",
            bgcolor: "rgba(255,255,255,0.88)",
            bordercolor: "rgba(0,0,0,0.18)",
            borderwidth: 1,
          },
        }, { responsive: true, displaylogo: false });
      }

      function applyStatusPayload(payload, keepLatest = true) {
        state.epochsByTab = payload.epochs || {};
        setEpochs(state.epochsByTab[state.tab] || [], keepLatest);
        updateMetricCards(payload);
        renderPlotly(payload.loss_history || []);
        updateView();
      }

      function refreshEpochs() {
        buildEpochs();
        updateView();
      }

      async function refreshLiveEpochs(keepLatest = true) {
        if (window.location.protocol === "file:") {
          refreshEpochs();
          liveStatus.textContent =
            "Static file mode. Use app.py for live folder scanning.";
          return;
        }

        try {
          const run = normalizeRunPath(runPath.value).replace(/^(\.\.\/)+/, "");
          const response = await fetch(
            `/api/epochs?run=${encodeURIComponent(run)}`,
            { cache: "no-store" },
          );
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.error || "Could not read epochs.");
          }
        applyStatusPayload(payload, keepLatest);
      } catch (error) {
        liveStatus.textContent = error.message;
      }
    }

    plotImage.addEventListener("error", () => {
        plotImage.style.display = "none";
        missingMessage.style.display = "block";
        missingMessage.textContent = `No image found for ${tabs[state.tab].title} at ${epochLabel.textContent}. Check the run folder, max epoch, and plot interval.`;
      });

    function setLiveMode(enabled) {
      state.live = enabled;
      liveButton.textContent = enabled ? "Live On" : "Live Off";
      liveButton.setAttribute("aria-pressed", String(enabled));
      if (state.eventSource) {
        state.eventSource.close();
        state.eventSource = null;
      }
      if (state.liveTimer) {
        clearInterval(state.liveTimer);
        state.liveTimer = null;
      }
      if (enabled) {
        if (window.EventSource && window.location.protocol !== "file:") {
          const run = normalizeRunPath(runPath.value).replace(/^(\.\.\/)+/, "");
          state.eventSource = new EventSource(`/api/events?run=${encodeURIComponent(run)}`);
          state.eventSource.addEventListener("training_status", (event) => {
            applyStatusPayload(JSON.parse(event.data), true);
          });
          state.eventSource.addEventListener("heartbeat", (event) => {
            updateMetricCards(JSON.parse(event.data));
          });
          state.eventSource.onerror = () => {
            liveStatus.textContent = "Stream disconnected. Falling back to polling.";
            if (state.eventSource) {
              state.eventSource.close();
              state.eventSource = null;
            }
            refreshLiveEpochs(true);
            state.liveTimer = setInterval(() => refreshLiveEpochs(true), 4000);
          };
        } else {
          refreshLiveEpochs(true);
          state.liveTimer = setInterval(() => refreshLiveEpochs(true), 4000);
        }
      }
    }

      epochSlider.addEventListener("input", updateView);
      refreshButton.addEventListener("click", () => refreshLiveEpochs(false));
      liveButton.addEventListener("click", () => setLiveMode(!state.live));
      maxEpoch.addEventListener("change", refreshEpochs);
      plotEvery.addEventListener("change", refreshEpochs);
      runPath.addEventListener("change", () => {
        syncSelectedRun();
        state.epochsByTab = {};
        if (state.live) {
          setLiveMode(true);
        } else {
          refreshLiveEpochs(true);
        }
      });
      runSelect.addEventListener("change", () => selectRun(runSelect.value, true));

      tabButtons.forEach((button) => {
        button.addEventListener("click", () => {
          state.tab = button.dataset.tab;
          tabButtons.forEach((item) => {
            item.setAttribute("aria-selected", String(item === button));
          });
          if (state.epochsByTab[state.tab]) {
          setEpochs(state.epochsByTab[state.tab], false);
        }
        updateView();
      });
    });

      if (window.location.protocol === "file:") {
        loadRuns();
        refreshEpochs();
        liveStatus.textContent =
          "Static file mode. Use app.py for live folder scanning.";
      } else {
        loadRuns();
        setLiveMode(true);
      }
    </script>
  </body>
</html>
